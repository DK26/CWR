[workspace]
resolver = "2"
members = [
    "crates/poseidon-catalog",
    "crates/poseidon-syntax",
    "crates/poseidon-lsp",
    "crates/poseidon-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ofpisnotdead-com/CWR-CE"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
dashmap = "6"
ropey = "1"
